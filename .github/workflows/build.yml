name: Build installer

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (без префикса v)'
        required: false
        default: ''

jobs:
  # Релиз собирается ТОЛЬКО после зелёного набора проверок: compileall, ruff, pytest.
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile check
        shell: pwsh
        run: python -m compileall -q src installer

      - name: Ruff check
        shell: pwsh
        run: ruff check src installer tests --ignore E501,E722

      - name: Pytest
        shell: pwsh
        run: python -m pytest tests -q

  build:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $v = "0.0.0-dev+${{ github.sha }}".Substring(0, 20)
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version: $v"

      # Запекаем версию в src/version.py: после установки APP_VERSION уже нет,
      # и сервер должен показывать версию установщика, а не дефолтную.
      - name: Bake version into src/version.py
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          "VERSION = '$v'" | Set-Content -Path src/version.py -Encoding UTF8
          Get-Content src/version.py | Select-Object -Last 1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Inno Setup на runners уже есть как chocolatey-пакет
          choco install innosetup --no-progress -y

      - name: Verify Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Не нашёл ISCC.exe"
          }
          Write-Host "ISCC: $iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & $env:ISCC /Qp installer/setup.iss
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1cMcpBridge-Setup-${{ steps.ver.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
