name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q src installer

      - name: Lint (Ruff)
        run: ruff check src installer --ignore E501,E722

      - name: Tests
        run: pytest tests -q
