name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@8d9ed9ac5c5342a1a2c48f63e5f3b03ad01ad66c  # v5.5.0
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q src installer

      - name: Lint (Ruff)
        run: ruff check src installer --ignore E501,E722

      - name: Tests
        run: pytest tests -q
